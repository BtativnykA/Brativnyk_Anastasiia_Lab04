[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-registry"
version = "0.1.0"
description = "OOP domain model lab project (Lab04)"
requires-python = ">=3.11"
authors = [{ name = "Anastasiia Brativnyk" }]

[project.optional-dependencies]
dev = ["mypy>=1.10"]

[project.scripts]
student-registry = "student_registry.main:main"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true